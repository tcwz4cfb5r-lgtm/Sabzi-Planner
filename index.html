<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabzi Week Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f2; --card:#ffffff; --ink:#23281f; --muted:#6f7568; --line:#ebe5d9;
    --green:#2f7d4a; --green-soft:#e6f2e9; --saffron:#e8862a; --saffron-soft:#fdf0e2;
    --red:#c2453b; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
  header.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  header.top .logo{font-size:28px}
  header.top h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.2px}
  header.top p{margin:0;color:var(--muted);font-size:13px}
  h2{font-size:17px;margin:20px 0 10px;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--green-soft);color:var(--green)}
  .btn.primary{background:var(--green);color:#fff}
  .btn.block{display:flex;width:100%;font-size:17px;padding:15px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap}

  /* bottom nav */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf9;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
  nav.tabs .in{display:flex;max-width:560px;width:100%}
  nav.tabs button{flex:1;padding:10px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
  nav.tabs button .i{font-size:22px;line-height:1.1}
  nav.tabs button.on{color:var(--green)}
  nav.tabs button.on .i{transform:scale(1.08)}

  /* fridge */
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;margin-bottom:10px}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;line-height:1.15}
  .chip .e{font-size:22px;display:block}
  .chip .n{font-weight:700;font-size:14px;display:block}
  .chip .h{font-size:11.5px;color:var(--muted)}
  .chip:active{transform:scale(.97)}
  .chip.sel{background:var(--green-soft);border-color:var(--green)}
  .have{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .item .e{font-size:24px;width:30px;text-align:center}
  .item .nm{flex:1;min-width:0;line-height:1.15}
  .item .nm b{display:block;font-size:15px}
  .item .nm span{font-size:12px;color:var(--muted)}
  .seg{display:flex;background:#f3efe6;border-radius:10px;padding:3px}
  .seg button{padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .x{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px}
  .x:active{background:#f3efe6}
  .empty{text-align:center;padding:22px 12px;color:var(--muted)}
  .empty .big{font-size:40px}
  .sticky-cta{position:fixed;left:0;right:0;bottom:66px;padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,rgba(251,248,242,0));z-index:4}
  .sticky-cta .in{max-width:528px;margin:0 auto}

  /* menu */
  .day{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .day.today{border-color:var(--saffron);box-shadow:0 0 0 2px var(--saffron-soft)}
  .day .dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#faf6ee;font-weight:800}
  .day.today .dh{background:var(--saffron-soft)}
  .day .dh .tag{font-size:11px;background:var(--saffron);color:#fff;border-radius:20px;padding:2px 8px;font-weight:800}
  .meal{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
  .meal:first-of-type{border-top:none}
  .meal .slot{font-size:20px;width:26px;text-align:center}
  .meal .body{flex:1;min-width:0;cursor:pointer}
  .meal .body .lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .meal .body .dn{font-weight:800;font-size:15.5px}
  .meal .body .sd{font-size:12.5px;color:var(--muted)}
  .meal .vs{font-size:13px;letter-spacing:1px}
  .swap{width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--green);background:var(--green-soft);flex:none}
  .swap:active{transform:rotate(90deg)}
  .notice{background:var(--saffron-soft);border-radius:12px;padding:12px 14px;font-size:14px}
  .glabel{font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 8px}
  .glabel:first-child{margin-top:2px}
  .daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .daysel button{padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px}
  .daysel button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .styleseg{display:flex;gap:6px}
  .styleseg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px}
  .styleseg button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}

  /* add */
  textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);padding:12px;font:inherit;font-size:15px;resize:vertical;background:#fff}
  .filebtn{position:relative;overflow:hidden}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .found{margin-top:12px}
  .steps{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
  .steps li{margin:3px 0}
  .logos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .logos span{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:#f3efe6}

  /* sheet */
  .overlay{position:fixed;inset:0;background:rgba(20,25,18,.42);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px 28px;max-height:86vh;overflow:auto}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
  .sheet h3{margin:0 0 4px;font-size:21px}
  .vtags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .vtags span{background:var(--green-soft);color:var(--green);font-weight:700;font-size:13px;border-radius:20px;padding:4px 10px}
  .vtags span.opt{background:#f3efe6;color:var(--muted)}
  .recipe{white-space:pre-wrap;font-size:15px;line-height:1.5;background:#faf6ee;border-radius:12px;padding:12px;margin-top:12px}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#23281f;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .saved{font-size:12px;color:var(--muted);text-align:right;min-height:16px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

  <header class="top">
    <div class="logo">🥕</div>
    <div>
      <h1>Sabzi Week Planner</h1>
      <p>What's in the fridge → what to cook all week</p>
    </div>
    <button class="btn ghost" id="custBtn" style="margin-left:auto;padding:8px 12px;font-size:14px;flex:none">⚙️ Customize</button>
  </header>
  <div class="saved" id="saved"></div>
  <main id="view"></main>
</div>
<div id="cta" class="sticky-cta" style="display:none"><div class="in"></div></div>
<nav class="tabs"><div class="in">

  <button data-tab="add"><span class="i">🧾</span>Scan Bill</button>
</div></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const DAYMS = 864e5;
const dnum = s => Math.round(Date.parse(s+'T00:00:00Z')/DAYMS);
const dstr = n => new Date(n*DAYMS).toISOString().slice(0,10);
const XSLOT = {k:'x', e:'🧁', l:'Baking treat'};
const slotOf = j => j<3 ? SLOTS[j] : XSLOT;
const isNV = r => r.need.some(id=>VM[id] && VM[id].g==='n');
function vegOnlyDay(start, i){ return (S.vegDays||[]).includes(dayDate(start,i).getDay()); }
function recipeKeys(r){ const k = r.need.map(id=>'v:'+id); k.push('d:'+r.n); (r.t||[]).forEach(t=>k.push('t:'+t)); return k; }
function activeRules(){ return (S.custom.rules||[]).filter(x=>x.every>0); }
const isSpecialRule = R => R.every>=60 && !R.key.startsWith('v:');
function keyLabel(k){
  const [t, v] = [k.slice(0,1), k.slice(2)];
  if (t==='v') return VM[v] ? VM[v].n + (VM[v].h && VM[v].h!=='My item' ? ' ('+VM[v].h+')' : '') : v;
  if (t==='t') return {dal:'Dal (any dal dish)', bake:'A baking item'}[v] || v;
  return v;
}
// occurrences: key -> [day numbers], from history + given menu-like rows
function buildOcc(extraRows){
  const occ = {};
  const add = (n, names) => names.forEach(nm=>{ const r = RM[nm]; if (!r) return; recipeKeys(r).forEach(k=>(occ[k]=occ[k]||[]).push(n)); });
  (S.log||[]).forEach(e=>add(dnum(e.d), e.n));
  (extraRows||[]).forEach(([n,names])=>add(n,names));
  return {occ, add};
}
function isSpecialDish(r){ const keys = recipeKeys(r); return activeRules().some(R=>isSpecialRule(R) && keys.includes(R.key)); }
function ruleBlocked(r, dayN, occ){
  const keys = recipeKeys(r);
  for (const R of activeRules()){
    if (!keys.includes(R.key)) continue;
    if ((occ[R.key]||[]).some(o=>Math.abs(dayN-o) < R.every)) return true;
  }
  return false;
}
function ruleDue(R, dayN, occ){
  const prev = (occ[R.key]||[]).filter(o=>o<=dayN);
  return !prev.length || dayN - Math.max(...prev) >= R.every;
}
function dueBoost(r, dayN, occ){
  const keys = recipeKeys(r); let b = 0;
  for (const R of activeRules()){
    if (!keys.includes(R.key) || isSpecialRule(R) || !ruleDue(R, dayN, occ)) continue;
    const prev = (occ[R.key]||[]).filter(o=>o<=dayN);
    const over = prev.length ? dayN - Math.max(...prev) - R.every : 7;
    b += 7 + Math.min(6, over/2);
  }
  return b;
}
const BF_GROUPS = {any:'Any breakfast', batter:'Idli / Dosa batter', oats:'Oats', moong:'Green moong dosa', poha:'Poha & Upma', paratha:'Parathas', eggs:'Eggs'};
function bfGroupFor(dayN){
  const rot = S.custom.rotation;
  if (!rot || !rot.on || !rot.weeks.length) return 'any';
  const w = Math.floor((dayN - dnum(rot.anchor))/7), L = rot.weeks.length;
  return rot.weeks[((w % L) + L) % L] || 'any';
}
function rotWeekNo(dayN){ const rot=S.custom.rotation, L=rot.weeks.length; const w=Math.floor((dayN-dnum(rot.anchor))/7); return ((w%L)+L)%L + 1; }
function scoreRecipe(r, slot, dayIdx, avail, dayUsed, dayN, occ){
  const style = S.style;
  let sc = 0;
  if (r.need.length===0) sc = 0.5;
  if (isNV(r) && dayUsed.has('__nv')) sc -= 2.5;
  for (const id of r.need){
    const v = VM[id]; if (!v) continue;
    sc += 3 + (v.st ? -1.2 : 0) + (v.p||1) * (dayIdx<3 ? 1.2 : 0.2);
    if (dayUsed.has(id) && !v.st) sc -= 3.5;
  }
  sc += r.opt.filter(id=>avail(id)).length * 0.7;
  if (style!=='mix'){ if (r.reg===style) sc += 2.5; else if (r.reg!=='a') sc -= 3; }
  if (occ) sc += dueBoost(r, dayN, occ);
  return sc + Math.random()*2;
}
function archiveMenu(beforeN){
  if (!S.menu) return;
  S.log = S.log || [];
  const s0 = dnum(S.menu.start);
  S.menu.days.forEach((row,i)=>{
    const n = s0+i; if (n >= beforeN) return;
    const d = dstr(n);
    const names = row.filter(Boolean).concat(S.menu.extra && S.menu.extra[i] ? [S.menu.extra[i]] : []);
    S.log = S.log.filter(e=>e.d!==d); S.log.push({d, n:names});
  });
  S.log.sort((a,b)=>a.d<b.d?-1:1);
  S.log = S.log.filter(e=>dnum(e.d) >= beforeN-130);
}
function planWeek(){
  const start = todayStr(), s0 = dnum(start);
  archiveMenu(s0);
  const rem = {};
  for (const id of haveIds()) rem[id] = S.fridge[id] * VM[id].u;
  const usedNames = new Set(), hidden = new Set(S.custom.hidden);
  const {occ, add} = buildOcc();
  const days = Array.from({length:7}, ()=>[null,null,null]);
  const extra = Array(7).fill(null);
  const buy = [];
  const have = new Set(haveIds());
  // 1) Specials on the weekend
  const wkend = [...Array(7).keys()].filter(i=>[0,6].includes(dayDate(start,i).getDay()));
  const mainSlot = S.custom.meals.includes('d') ? 2 : (S.custom.meals.includes('l') ? 1 : -1);
  const specials = activeRules().filter(isSpecialRule);
  if (wkend.length && mainSlot>=0){
    const dish = specials.filter(R=>R.key!=='t:bake').map(R=>{
      const prev=(occ[R.key]||[]).filter(o=>o<s0); return {R, last: prev.length?Math.max(...prev):-1e9};
    }).filter(x=>ruleDue(x.R, s0+wkend[0], occ)).sort((a,b)=>a.last-b.last)[0];
    if (dish){
      const di = wkend.find(x=>dayDate(start,x).getDay()===6) ?? wkend[0];
      const cands = R.filter(r=>!hidden.has(r.n) && recipeKeys(r).includes(dish.R.key) && r.s!=='x');
      const r = cands[Math.floor(Math.random()*cands.length)];
      if (r && !vegOnlyDay(start,di)){
        days[di][mainSlot] = r.n; usedNames.add(r.n); add(s0+di,[r.n]);
        r.need.forEach(id=>{ if (!have.has(id)) buy.push(VM[id].n+' (for '+r.n+')'); else rem[id]--; });
        (r.shop||[]).forEach(x=>buy.push(x+' (for '+r.n+')'));
      }
    }
  }
  const bakeR = specials.find(R=>R.key==='t:bake');
  if (bakeR && wkend.length){
    const di = wkend.find(x=>dayDate(start,x).getDay()===0) ?? wkend[0];
    if (ruleDue(bakeR, s0+di, occ)){
      const cands = R.filter(r=>r.s==='x' && !hidden.has(r.n));
      const r = cands[Math.floor(Math.random()*cands.length)];
      if (r){ extra[di] = r.n; add(s0+di,[r.n]); }
    }
  }
  // 2) Regular meals
  for (let d=0; d<7; d++){
    const dayN = s0+d, dayUsed = new Set();
    days[d].forEach(n=>{ if(n && RM[n]){ RM[n].need.forEach(id=>dayUsed.add(id)); if (isNV(RM[n])) dayUsed.add('__nv'); } });
    const vegOnly = vegOnlyDay(start, d);
    SLOTS.forEach(({k}, j)=>{
      if (days[d][j]) return;
      if (!S.custom.meals.includes(k)) return;
      const grp = k==='b' ? bfGroupFor(dayN) : 'any';
      const base = r => !hidden.has(r.n) && r.s.includes(k) && r.need.every(id=>rem[id]>0) && !(vegOnly && isNV(r)) && !isSpecialDish(r);
      const inGrp = r => grp==='any' || r.bg===grp;
      const tiers = [
        r => base(r) && inGrp(r) && !ruleBlocked(r,dayN,occ) && !usedNames.has(r.n),
        r => base(r) && inGrp(r) && !ruleBlocked(r,dayN,occ),
        r => base(r) && !ruleBlocked(r,dayN,occ) && !usedNames.has(r.n),
        r => base(r) && !ruleBlocked(r,dayN,occ),
      ];
      let c = [];
      for (const f of tiers){ c = R.filter(f); if (c.length) break; }
      if (!c.length) return;
      const scored = c.map(r=>({r, sc:scoreRecipe(r,k,d,id=>rem[id]>0,dayUsed,dayN,occ)})).sort((a,b)=>b.sc-a.sc);
      const pick = scored[Math.random()<0.7 ? 0 : Math.min(1, scored.length-1)].r;
      pick.need.forEach(id=>{ rem[id]--; dayUsed.add(id); });
      if (isNV(pick)) dayUsed.add('__nv');
      usedNames.add(pick.n); add(dayN,[pick.n]);
      days[d][j] = pick.n;
    });
  }
  // 3) Things due but not in the fridge
  for (const R of activeRules()){
    if (!R.key.startsWith('v:')) continue;
    const id = R.key.slice(2); if (!VM[id] || have.has(id)) continue;
    if (ruleDue(R, s0+6, occ)) buy.push(VM[id].n + ' — due (every '+R.every+' days)');
  }
  const finished = haveIds().filter(id=>rem[id]<=0);
  S.menu = {start, days, extra, finished, buy};
  save();
}
function menuOcc(exceptDi, exceptJ){
  const s0 = dnum(S.menu.start), rows = [];
  S.menu.days.forEach((row,i)=>rows.push([s0+i, row.filter((n,j)=>n && !(i===exceptDi && j===exceptJ))]));
  (S.menu.extra||[]).forEach((n,i)=>{ if (n && !(i===exceptDi && exceptJ===3)) rows.push([s0+i,[n]]); });
  const log = S.log; // exclude log days that overlap the menu
  const saved = S.log; S.log = (log||[]).filter(e=>dnum(e.d) < s0);
  const o = buildOcc(rows); S.log = saved; return o.occ;
}
function getMeal(i,j){ return j<3 ? S.menu.days[i][j] : (S.menu.extra||[])[i]; }
function swapMeal(di, si){
  const k = slotOf(si).k, have = new Set(haveIds());
  const inMenu = new Set(S.menu.days.flat().concat(S.menu.extra||[]));
  const others = S.menu.days[di].filter((n,j)=>j!==si && n).map(n=>RM[n]).filter(Boolean);
  const dayUsed = new Set(others.flatMap(r=>r.need));
  if (others.some(isNV)) dayUsed.add('__nv');
  const vegOnly = vegOnlyDay(S.menu.start, di);
  const hid = new Set(S.custom.hidden);
  const dayN = dnum(S.menu.start)+di, occ = menuOcc(di, si);
  const grp = k==='b' ? bfGroupFor(dayN) : 'any';
  const base = r => !hid.has(r.n) && r.s.includes(k) && !inMenu.has(r.n) && (k==='x' || r.need.every(id=>have.has(id))) && !(vegOnly && isNV(r)) && !ruleBlocked(r,dayN,occ);
  let c = R.filter(r=>base(r) && (grp==='any' || r.bg===grp));
  if (!c.length) c = R.filter(base);
  if (!c.length){ toast('No other dish fits your fridge and rules for this meal'); return; }
  const scored = c.map(r=>({r, sc:scoreRecipe(r,k,di,id=>have.has(id),dayUsed,dayN,occ)})).sort((a,b)=>b.sc-a.sc);
  const pick = scored[Math.floor(Math.random()*Math.min(4,scored.length))].r;
  if (si<3) S.menu.days[di][si] = pick.n; else S.menu.extra[di] = pick.n;
  save(); render();
  toast('Swapped to ' + pick.n);
}
function menuText(){
  const m = S.menu; let t = '🗓️ Weekly Menu\n';
  m.days.forEach((row,i)=>{
    t += '\n*' + fmtDay(dayDate(m.start,i)) + '*\n';
    row.forEach((n,j)=>{ if(!n) return; const r=RM[n]; const sd = r ? sideFor(r,SLOTS[j].k) : ''; t += SLOTS[j].e + ' ' + n + (sd ? ' ('+sd+')' : '') + '\n'; });
    if (m.extra && m.extra[i]) t += XSLOT.e + ' ' + m.extra[i] + '\n';
  });
  return t;
}

function currentTab(){ const h=(location.hash||'').slice(1); return ['fridge','menu','add'].includes(h) ? h : (haveIds().length ? 'menu' : 'fridge'); }
function go(tab){ if (location.hash !== '#'+tab) location.hash = tab; else render(); }

  const el = document.getElementById('chips');
  const raw = fridgeFilter.trim().replace(/\s+/g,' ');
  const exact = raw && VEG.some(v=>v.n.toLowerCase()===f || v.h.toLowerCase()===f || v.a.includes(f));
  const addBox = (raw && !exact) ? `<div class="card" style="margin-bottom:12px;background:var(--saffron-soft);border-color:#f3d9bb">

      <div class="row-btns" style="margin-top:10px">${GROUPS.map(G=>`<button class="btn ${G.g==='v'?'primary':'ghost'}" data-newg="${G.g}" style="padding:9px 12px;font-size:14px">${G.l.split(' ')[0]} ${G.g==='v'?'Vegetable':G.g==='d'?'Dairy':'Non-veg'}</button>`).join('')}</div></div>` : '';

      return `<div class="glabel">${G.l}</div><div class="chips">` + gl.map(v=>`<button class="chip" data-add="${v.id}"><span class="e">${v.e}</span><span class="n">${esc(v.n)}</span><span class="h">${esc(v.h)}</span></button>`).join('') + `</div>`; }).join('')
    : (exact ? `<p class="muted small">Already in your fridge.</p>` : '')) + otherChip;
  el.querySelectorAll('[data-newg]').forEach(b=>b.onclick=()=>{
    const it = addCustomItem(raw, b.dataset.newg); if (!it) return;

function drawShotArea(){

function parseText(txt){
  let work = ' ' + txt.toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ') + ' ';
  for (const x of EXCLUDE) work = work.split(' '+x+' ').join(' # ');
  const ids = new Set();
  const pairs = VEG.flatMap(v=>v.a.map(a=>[a,v.id])).sort((a,b)=>b[0].length-a[0].length);
  for (const [a,id] of pairs){
    const re = new RegExp(' ' + a.replace(/ /g,' ') + 's? ', 'g');
    if (re.test(work)){ ids.add(id); work = work.replace(re,' # '); }
  }
  return [...ids];
}
async function readShots(files){
  if (!files.length) return;
  const box = document.getElementById('foundBox');
  box.innerHTML = `<div class="card"><span class="spin"></span> Reading your bill…</div>`;
  box.scrollIntoView({block:'center'});
  const list = VEG.map(v=>`${v.id} = ${v.n} / ${v.h}`).join('\n');
  const prompt = `These images are Indian grocery bills or orders: a photo of a paper bill or receipt (printed or handwritten, from a local shop, sabziwala, supermarket or dairy) or a screenshot of an app order (Amazon, Flipkart, Swiggy Instamart, BigBasket, Zepto, Blinkit). Bills often use short forms or Hindi/regional names (e.g. "TMTO" = tomato, "BHNDI" = okra, "ALU" = potato, "PNR" = paneer, "DAHI" = curd).\n\nFind every fresh vegetable, dairy item (milk, curd, paneer, cheese, butter, cream) and egg/meat/fish item. Ignore fruits, grains, dals, atta, oil, spices, masalas, snacks, drinks, ice cream, household items, and also coriander, chillies, ginger, garlic, lemon, curry leaves.\n\nKnown items (id = name):\n${list}\n\nFor each item give "level": 1 if the quantity is small (under 250 g, under 500 ml, or under 6 eggs), 2 for a normal amount (250 g to 1 kg, 500 ml to 1 L, 6 to 12 eggs, or quantity unclear), 3 for a lot (more than that). If an item appears twice, use the larger level.\nPut items that match the known list in "items" using their id. Put real vegetables, dairy or meat/fish that are NOT in the known list in "new", with a short common English or Hindi name (e.g. "Kundru", "Parwal", "Crab") and "group": "v" vegetable, "d" dairy, "n" egg/meat/fish.\nReturn ONLY JSON like {"items":[{"id":"onion","level":3}],"new":[{"name":"Kundru","group":"v","level":2}]}. If the image is not a bill or nothing matches, return {"items":[],"new":[]}.`;
  try {
    const imgs = await Promise.all(files.slice(0,6).map(shrinkImage));
    const res = await sampleCap.json(prompt, {images: imgs, modelTier:'default'});
    const items = (res && res.items || []).filter(x=>VM[x.id]);
    const lvl = x => Math.min(3,Math.max(1,+x.level||2));
    const seen = new Map(); items.forEach(x=>seen.set(x.id, Math.max(seen.get(x.id)||0,lvl(x))));
    found = [...seen].map(([id,lv])=>({id,lv,on:true}));
    const newSeen = new Set();
    (res && res.new || []).forEach(x=>{
      const name = String(x.name||'').trim().slice(0,40); if (!name) return;
      const lc = name.toLowerCase(); if (newSeen.has(lc)) return; newSeen.add(lc);
      const match = VEG.find(v=>v.n.toLowerCase()===lc || v.a.includes(lc));
      if (match){ if (!seen.has(match.id)){ seen.set(match.id,1); found.push({id:match.id, lv:lvl(x), on:true}); } return; }
      found.push({newName: name.charAt(0).toUpperCase()+name.slice(1), g: ['v','d','n'].includes(x.group)?x.group:'v', lv:lvl(x), on:true});
    });
    drawFound(found.length ? '' : "Couldn't spot any vegetables, dairy or meat in that photo. Try a clearer, closer photo in good light, or paste the text.");
  } catch(err){
    const c = err && err.code;
    drawFound(c==='rate_limited' ? 'Too many requests — try again in a minute.' : c==='not_granted' ? 'Reading photos was not allowed. You can paste the text instead.' : 'Something went wrong reading the photo. Try again or paste the text.');
  }
}
async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    if (k===1 && file.size < 3e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85));
  } catch(e){ return file; }
}
function drawFound(msg){
  const box = document.getElementById('foundBox'); if (!box) return;
  if (msg){ box.innerHTML = `<div class="notice">${esc(msg)}</div>`; return; }
  const n = found.filter(f=>f.on).length;
  box.innerHTML = `<div class="card"><b>Found ${found.length} item${found.length>1?'s':''}</b> <span class="small muted">— tap to untick</span>
    <div class="chips" style="margin-top:10px">${found.map((f,i)=>{const v=f.newName?{e:GEMOJI[f.g],n:f.newName}:VM[f.id]; return `<button class="chip ${f.on?'sel':''}" data-f="${i}"><span class="e">${v.e}</span><span class="n">${esc(v.n)}</span><span class="h">${f.on?'✓ ':''}${f.newName?'New · ':''}${LEVELS[f.lv]}</span></button>`;}).join('')}</div>
    ${found.some(f=>f.newName)?'<p class="small muted" style="margin:8px 0 0">"New" items aren\'t in the app yet — they\'ll be added to your list with a simple dish.</p>':''}
    <button class="btn primary block" id="addFound" style="margin-top:12px" ${n?'':'disabled'}>Add ${n} to my fridge</button></div>`;
  box.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const f=found[+b.dataset.f]; f.on=!f.on; drawFound(''); });
  document.getElementById('addFound').onclick = ()=>{
    found.filter(f=>f.on).forEach(f=>{
      let id = f.id;
      if (f.newName){ const ex = VEG.find(v=>v.n.toLowerCase()===f.newName.toLowerCase()); id = ex ? ex.id : (addCustomItem(f.newName, f.g)||{}).id; }
      if (id) S.fridge[id] = Math.max(S.fridge[id]||0, f.lv);
    });
    save(); toast(n+' items added to fridge'); found=[]; go('fridge');
  };
}

function openDish(i,j){
  const n = getMeal(i,j), r = RM[n], sl = slotOf(j);
  const have = new Set(haveIds());
  const d = dayDate(S.menu.start,i);
  const tags = r ? r.need.filter(id=>VM[id]).map(id=>`<span>${VM[id].e} ${esc(VM[id].n)}</span>`).join('') + r.opt.filter(id=>have.has(id)).map(id=>`<span class="opt">+ ${esc(VM[id].n)}</span>`).join('') : '';
  const sd = r ? sideFor(r, sl.k) : '';
  openSheet(`<div class="grab"></div><div class="small muted">${sl.e} ${sl.l} · ${fmtDay(d)}</div><h3>${esc(n)}</h3>${sd?`<div class="muted">${esc(sd)}</div>`:''}
    <div class="vtags">${tags || '<span class="opt">🫙 Pantry dish — no fresh veg needed</span>'}</div>
    <div class="row-btns"><button class="btn" id="sSwap">↻ Swap dish</button>${sampleCap?`<button class="btn primary" id="sHow">👩‍🍳 How to make it</button>`:''}<button class="btn ghost" id="sClose">Close</button></div>
    <div id="howBox"></div>`);
  document.getElementById('sSwap').onclick = ()=>{ closeSheet(); swapMeal(i,j); };
  document.getElementById('sClose').onclick = closeSheet;
  const hb = document.getElementById('sHow');
  if (hb) hb.onclick = ()=>howTo(n, r);
}
async function howTo(n, r){
  const box = document.getElementById('howBox');
  box.innerHTML = `<div class="recipe"><span class="spin"></span> Getting a simple recipe…</div>`;
  const out = box.firstChild;
  const avail = haveIds().map(id=>VM[id].n).join(', ');
  recipeAbort = new AbortController();
  const prompt = `Give a simple, home-style Indian recipe for "${n}" for a family of 4.\nVegetables available at home: ${avail || 'basic pantry only'}. Assume a normal Indian kitchen pantry (dals, rice, atta, spices, oil, ghee, curd).\nFormat exactly as plain text, no markdown symbols like # or **:\nTime: <total minutes>\n\nIngredients:\n- item – quantity\n(keep to the essentials)\n\nSteps:\n1. ...\n(5 to 8 short steps)\n\nTip: one practical tip.`;
  try {
    const res = await sampleCap(prompt, {modelTier:'quick', signal: recipeAbort.signal, onText: ({text})=>{ out.textContent = text; }});
    out.textContent = res.text;
  } catch(err){
    if (err && err.name==='AbortError') return;
    out.textContent = (err && err.code==='rate_limited') ? 'Too many requests — try again in a minute.' : 'Could not load the recipe right now.';
  }
}

/* ---------------- Customize ---------------- */
let custQ = '', draft = null;
const GEMOJI = {v:'🥗', d:'🥛', n:'🍖'};
function addCustomItem(name, g){
  const n = name.trim().replace(/\s+/g,' '); if (!n) return null;
  const lc = n.toLowerCase();
  if (VEG.some(v=>v.n.toLowerCase()===lc || v.a.includes(lc))){ toast('That item is already in the list'); return null; }
  const it = {id:'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), n:n.charAt(0).toUpperCase()+n.slice(1), g, e:GEMOJI[g]};
  S.custom.items.push(it);
  const dn = g==='v' ? it.n+' Sabzi' : g==='n' ? it.n+' Curry' : null;
  if (dn && !RM[dn]) S.custom.dishes.push({n:dn, s:'ld', need:[it.id], side:'', auto:it.id});
  rebuild(); return it;
}
const slotNames = s => s.split('').map(k=>(SLOTS.find(x=>x.k===k)||XSLOT).l).join(', ');
function openCustomize(){ custQ=''; draft=null; renderCustomize(); overlay.classList.add('show'); sheet.scrollTop=0; }
function renderCustomize(){
  const C = S.custom, top = sheet.scrollTop;
  let h = `<div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center"><h3>⚙️ Customize</h3><button class="btn primary" id="cDone">Done</button></div>`;
  h += `<h2>Meals to plan</h2><div class="styleseg">${SLOTS.map(s=>`<button data-meal="${s.k}" class="${C.meals.includes(s.k)?'on':''}">${s.e} ${s.l}</button>`).join('')}</div>`;
  // Breakfast rotation
  const rot = C.rotation, todayN = dnum(todayStr());
  h += `<h2>🥞 Breakfast rotation</h2><p class="small muted" style="margin:-4px 0 8px">One kind of breakfast for the whole week, changing every week.</p>
    <div class="styleseg" style="margin-bottom:10px"><button data-rot="1" class="${rot.on?'on':''}">On</button><button data-rot="0" class="${rot.on?'':'on'}">Off</button></div>`;
  if (rot.on){
    h += `<div class="have">` + rot.weeks.map((g,i)=>`<div class="item" style="padding:6px 10px"><div class="nm"><b>Week ${i+1}</b>${rotWeekNo(todayN)===i+1?'<span style="color:var(--saffron);font-weight:800">This week</span>':''}</div>
      <select class="search" data-rweek="${i}" style="margin:0;width:auto;padding:8px">${Object.entries(BF_GROUPS).map(([k,l])=>`<option value="${k}" ${k===g?'selected':''}>${l}</option>`).join('')}</select>
      ${rot.weeks.length>1?`<button class="x" data-rdel="${i}" aria-label="Remove week">✕</button>`:''}</div>`).join('') + `</div>
      <div class="row-btns" style="margin-top:8px;align-items:center">${rot.weeks.length<8?'<button class="btn ghost" id="rAdd" style="padding:8px 12px;font-size:14px">+ Add a week</button>':''}
      <span class="small muted">This week is</span><select class="search" id="rNow" style="margin:0;width:auto;padding:8px">${rot.weeks.map((_,i)=>`<option value="${i+1}" ${rotWeekNo(todayN)===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></div>`;
  }
  // How often
  const occNow = buildOcc(S.menu ? S.menu.days.map((row,i)=>[dnum(S.menu.start)+i, row.filter(Boolean).concat(S.menu.extra&&S.menu.extra[i]?[S.menu.extra[i]]:[])]).filter(([n])=>!(S.log||[]).some(e=>dnum(e.d)===n)) : []).occ;
  const FREQ = [[7,'Every week'],[15,'Every 15 days'],[30,'Once a month'],[60,'Every 2 months'],[90,'Every 3 months']];
  const freqSel = (attr, val) => `<select class="search" ${attr} style="margin:0;width:auto;padding:8px">${FREQ.map(([d,l])=>`<option value="${d}" ${+val===d?'selected':''}>${l}</option>`).join('')}</select>`;
  h += `<h2>🔁 How often</h2><p class="small muted" style="margin:-4px 0 8px">The planner includes each item about this often, and not more. Specials (2–3 months) go on a weekend.</p>`;
  const rules = C.rules.map((R,i)=>({R,i})).sort((a,b)=>a.R.every-b.R.every || keyLabel(a.R.key).localeCompare(keyLabel(b.R.key)));
  h += `<div class="have">` + rules.map(({R,i})=>{
      const o = (occNow[R.key]||[]).filter(x=>x<=todayN); const last = o.length ? Math.max(...o) : null;
      const lastTxt = last===null ? 'Not had yet' : (todayN-last===0 ? 'Planned today' : 'Last: '+(todayN-last)+' days ago');
      const fut = (occNow[R.key]||[]).filter(x=>x>todayN); const nextTxt = fut.length ? ' · Planned '+fmtDay(new Date(Math.min(...fut)*DAYMS)) : '';
      return `<div class="item" style="padding:6px 10px"><div class="nm"><b>${isSpecialRule(R)?'🎉 ':''}${esc(keyLabel(R.key))}</b><span>${lastTxt}${nextTxt}</span></div>${freqSel(`data-rfreq="${i}"`, R.every)}<button class="x" data-rrm="${i}" aria-label="Remove rule">✕</button></div>`;
    }).join('') + `</div>`;
  const usedKeys = new Set(C.rules.map(R=>R.key));
  const optItems = VEG.filter(v=>!usedKeys.has('v:'+v.id)).map(v=>`<option value="v:${v.id}">${esc(v.n)}</option>`).join('');
  const optGroups = ['t:dal','t:bake'].filter(k=>!usedKeys.has(k)).map(k=>`<option value="${k}">${esc(keyLabel(k))}</option>`).join('');
  const optDishes = R.filter(r=>r.s!=='x' && !usedKeys.has('d:'+r.n)).sort((a,b)=>a.n.localeCompare(b.n)).map(r=>`<option value="d:${esc(r.n)}">${esc(r.n)}</option>`).join('');
  h += `<div class="card" style="margin-top:8px;background:#faf6ee"><div class="small muted" style="font-weight:700;margin-bottom:6px">Add a rule</div>
    <select class="search" id="nrKey"><optgroup label="Vegetables & items">${optItems}</optgroup>${optGroups?`<optgroup label="Groups">${optGroups}</optgroup>`:''}<optgroup label="Dishes">${optDishes}</optgroup></select>
    <div class="row-btns" style="align-items:center">${freqSel('id="nrFreq"', 15)}<button class="btn" id="nrAdd">+ Add rule</button></div></div>`;
  h += `<h2>My own dishes</h2><p class="small muted" style="margin:-4px 0 8px">Family favourites the planner should include.</p>`;
  if (C.dishes.length) h += `<div class="have">` + C.dishes.map((d,i)=>`<div class="item"><span class="e">🍲</span><div class="nm"><b>${esc(d.n)}</b><span>${esc(slotNames(d.s))}${d.need.filter(id=>VM[id]).length?' · '+esc(d.need.filter(id=>VM[id]).map(id=>VM[id].n).join(', ')):' · pantry dish'}</span></div><button class="x" data-deld="${i}" aria-label="Delete">✕</button></div>`).join('') + `</div>`;
  if (draft){
    h += `<div class="card" style="margin-top:8px;background:#faf6ee">
      <input class="search" id="dName" placeholder="Dish name, e.g. Dal Makhani" value="${esc(draft.n)}">
      <div class="small muted" style="margin:2px 0 6px;font-weight:700">Which meal?</div>
      <div class="styleseg">${SLOTS.map(s=>`<button data-dslot="${s.k}" class="${draft.s.includes(s.k)?'on':''}">${s.e} ${s.l}</button>`).join('')}</div>
      <div class="small muted" style="margin:12px 0 6px;font-weight:700">Main ingredients it needs <span style="font-weight:400">(skip for pantry dishes)</span></div>
      ${GROUPS.map(G=>{ const gl=VEG.filter(v=>v.g===G.g); return gl.length?`<div class="glabel">${G.l}</div><div class="chips">${gl.map(v=>`<button class="chip ${draft.need.includes(v.id)?'sel':''}" data-dneed="${v.id}"><span class="e">${v.e}</span><span class="n">${esc(v.n)}</span></button>`).join('')}</div>`:''; }).join('')}
      <input class="search" id="dSide" placeholder="Served with… (optional), e.g. with jeera rice" value="${esc(draft.side)}" style="margin-top:12px">
      <div class="row-btns"><button class="btn ghost" id="dCancel">Cancel</button><button class="btn primary" id="dSave">Save dish</button></div></div>`;
  } else h += `<button class="btn" id="newDish" style="margin-top:8px">+ Add a dish</button>`;
  h += `<h2>My own items</h2><p class="small muted" style="margin:-4px 0 8px">Something missing from the fridge list? Add it here.</p>`;
  if (C.items.length) h += `<div class="have">` + C.items.map((it,i)=>`<div class="item"><span class="e">${it.e}</span><div class="nm"><b>${esc(it.n)}</b><span>${GROUPS.find(g=>g.g===it.g).l}</span></div><button class="x" data-deli="${i}" aria-label="Delete">✕</button></div>`).join('') + `</div>`;
  h += `<div style="display:flex;gap:6px;margin-top:8px"><input class="search" id="itName" placeholder="e.g. Kundru, Tofu, Crab" style="margin:0;flex:1"><select id="itGroup" class="search" style="margin:0;width:auto">${GROUPS.map(g=>`<option value="${g.g}">${g.l}</option>`).join('')}</select></div>
    <button class="btn" id="addIt" style="margin-top:8px">+ Add item</button>`;
  h += `<h2>Dishes we don't eat</h2><p class="small muted" style="margin:-4px 0 8px">Tap a dish to hide it. Hidden dishes are never planned.</p>
    <input class="search" id="hq" placeholder="Search dishes…" value="${esc(custQ)}"><div id="hlist" class="have"></div>`;
  sheet.innerHTML = h;
  drawHidden();
  sheet.scrollTop = top;
  const on = (id, fn) => { const el=document.getElementById(id); if (el) el.onclick = fn; };
  on('cDone', ()=>{ closeSheet(); render(); });
  sheet.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.meal, m=new Set(C.meals); if (m.has(k)){ if (m.size===1){ toast('Keep at least one meal'); return; } m.delete(k);} else m.add(k);
    C.meals = SLOTS.map(s=>s.k).filter(x=>m.has(x)); save(); renderCustomize(); toast('Tap Re-plan to update the menu');
  });
  sheet.querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{ C.rotation.on = b.dataset.rot==='1'; save(); renderCustomize(); });
  sheet.querySelectorAll('[data-rweek]').forEach(el=>el.onchange=()=>{ C.rotation.weeks[+el.dataset.rweek] = el.value; save(); toast('Tap Re-plan to update the menu'); });
  sheet.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{ const cur=rotWeekNo(todayN); C.rotation.weeks.splice(+b.dataset.rdel,1); const L=C.rotation.weeks.length; C.rotation.anchor = dstr(todayN - (Math.min(cur,L)-1)*7); save(); renderCustomize(); });
  on('rAdd', ()=>{ const cur=rotWeekNo(todayN); C.rotation.weeks.push('any'); C.rotation.anchor = dstr(todayN - (cur-1)*7); save(); renderCustomize(); });
  const rNow = document.getElementById('rNow'); if (rNow) rNow.onchange = ()=>{ C.rotation.anchor = dstr(todayN - (+rNow.value-1)*7); save(); renderCustomize(); toast('Tap Re-plan to update the menu'); };
  sheet.querySelectorAll('[data-rfreq]').forEach(el=>el.onchange=()=>{ C.rules[+el.dataset.rfreq].every = +el.value; save(); renderCustomize(); });
  sheet.querySelectorAll('[data-rrm]').forEach(b=>b.onclick=()=>{ const R0=C.rules.splice(+b.dataset.rrm,1)[0]; save(); renderCustomize(); toast(keyLabel(R0.key)+' rule removed'); });
  on('nrAdd', ()=>{ const k=document.getElementById('nrKey').value, f=+document.getElementById('nrFreq').value; if(!k) return; C.rules.push({key:k, every:f}); save(); renderCustomize(); toast('Rule added — tap Re-plan to apply'); });
  sheet.querySelectorAll('[data-deld]').forEach(b=>b.onclick=()=>{ const d=C.dishes.splice(+b.dataset.deld,1)[0]; rebuild(); save(); renderCustomize(); toast(d.n+' removed'); });
  sheet.querySelectorAll('[data-deli]').forEach(b=>b.onclick=()=>{
    const it=C.items.splice(+b.dataset.deli,1)[0]; delete S.fridge[it.id]; C.dishes = C.dishes.filter(d=>d.auto!==it.id); C.rules = C.rules.filter(R=>R.key!=='v:'+it.id); C.dishes.forEach(d=>d.need=d.need.filter(x=>x!==it.id));
    rebuild(); save(); renderCustomize(); toast(it.n+' removed');
  });
  on('newDish', ()=>{ draft={n:'',s:'',need:[],side:''}; renderCustomize(); setTimeout(()=>{ const i=document.getElementById('dName'); if(i) i.focus(); },50); });
  if (draft){
    document.getElementById('dName').oninput = e=>draft.n=e.target.value;
    document.getElementById('dSide').oninput = e=>draft.side=e.target.value;
    sheet.querySelectorAll('[data-dslot]').forEach(b=>b.onclick=()=>{ const k=b.dataset.dslot; draft.s = draft.s.includes(k) ? draft.s.replace(k,'') : SLOTS.map(s=>s.k).filter(x=>draft.s.includes(x)||x===k).join(''); renderCustomize(); });
    sheet.querySelectorAll('[data-dneed]').forEach(b=>b.onclick=()=>{ const id=b.dataset.dneed; draft.need = draft.need.includes(id) ? draft.need.filter(x=>x!==id) : draft.need.concat(id); renderCustomize(); });
    on('dCancel', ()=>{ draft=null; renderCustomize(); });
    on('dSave', ()=>{
      const n = draft.n.trim().replace(/\s+/g,' ');
      if (!n){ toast('Give the dish a name'); return; }
      if (!draft.s){ toast('Pick breakfast, lunch or dinner'); return; }
      if (RM[n]){ toast('A dish with this name already exists'); return; }
      C.dishes.push({n, s:draft.s, need:draft.need.slice(), side:draft.side.trim()});
      draft=null; rebuild(); save(); renderCustomize(); toast(n+' added');
    });
  }
  on('addIt', ()=>{
    const n = document.getElementById('itName').value.trim().replace(/\s+/g,' ');
    const g = document.getElementById('itGroup').value;
    if (!n){ toast('Type the item name'); return; }
    if (!addCustomItem(n, g)) return;
    save(); renderCustomize(); toast(n+' added to the fridge list');
  });
  document.getElementById('hq').oninput = e=>{ custQ=e.target.value; drawHidden(); };
}
function drawHidden(){
  const el = document.getElementById('hlist'); if (!el) return;
  const hid = new Set(S.custom.hidden), q = custQ.trim().toLowerCase();
  const list = R.filter(r=>!q || r.n.toLowerCase().includes(q)).sort((a,b)=>(hid.has(b.n)-hid.has(a.n)) || a.n.localeCompare(b.n));
  el.innerHTML = list.map(r=>`<div class="item" style="padding:6px 10px"><div class="nm"><b style="${hid.has(r.n)?'text-decoration:line-through;color:var(--muted)':''}">${esc(r.n)}</b><span>${esc(slotNames(r.s))}</span></div>
    <button class="btn ${hid.has(r.n)?'':'ghost'}" data-hide="${esc(r.n)}" style="padding:7px 12px;font-size:13px;${hid.has(r.n)?'background:#fbe9e7;color:var(--red)':''}">${hid.has(r.n)?'Hidden':'Hide'}</button></div>`).join('') || '<p class="small muted">No dishes match.</p>';
  el.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.hide, s=new Set(S.custom.hidden); s.has(n)?s.delete(n):s.add(n); S.custom.hidden=[...s]; save(); drawHidden();
  });
}
document.getElementById('custBtn').onclick = openCustomize;

/* ---------------- Boot ---------------- */
let sampleReady = false;
render();
(async ()=>{
  try {
    const r = await fetch(location.href, {cache:'no-store'});
    if (r.ok){ const t = await r.text(); if (/^<!DOCTYPE html>/i.test(t.trim()) && t.includes('id="state"') && t.includes('Sabzi Week Planner')) SRC = t; }
  } catch(e){}
})();
(async ()=>{
  try { artifactCap = window.claude ? await window.claude.use('artifact') : null; } catch(e){ artifactCap = null; }
  if (!artifactCap) setSaved('Saved on this device');
})();

    sampleCap = window.claude ? await window.claude.use('sample') : null;

})();
setTimeout(()=>{ if(!sampleReady){ sampleReady = true; drawShotArea(); } }, 11000);
